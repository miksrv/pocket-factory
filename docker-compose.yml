services:
    supervisor:
        build: .
        image: pocket-factory:local
        container_name: pocket-factory
        restart: unless-stopped
        env_file: .env
        # The container is the control plane (web UI, Telegram, the queue): the agents run in Docker
        # Sandboxes, one microVM per project on the host (SPEC §8), which the supervisor drives through
        # the host's sbx daemon. No claude process runs in here.
        mem_limit: ${CONTAINER_MEMORY:-2g}
        pids_limit: 1024
        # The host user the sandboxes belong to (sbx keeps its daemon and stores per user): uid 1000 is
        # also the image's `node`.
        user: '1000:1000'
        environment:
            # The sandbox is the boundary; inside it Claude Code runs unattended.
            CLAUDE_PERMISSION_MODE: bypassPermissions
            # WEB_PORT in .env is the host side of the mapping below; inside, the
            # supervisor always listens on 8080 (env_file would hand it the host's value).
            WEB_PORT: 8080
            # Every path is the host's own (DATA_DIR, WORKSPACES_DIR): a sandbox mounts the same
            # directories at the same paths, so cwd, attachments and transcripts mean the same inside.
            DATA_ROOT: ${DATA_DIR:?set DATA_DIR in .env to the absolute host path of data/}
            CLAUDE_CONFIG_DIR: ${DATA_DIR:?set DATA_DIR in .env to the absolute host path of data/}/claude
            WORKSPACES_ROOT: ${WORKSPACES_DIR:?set WORKSPACES_DIR in .env to an absolute host path}
            # The sbx client acts for the host user: its home holds the daemon's socket and stores.
            SBX_HOME: ${SBX_HOME:?set SBX_HOME in .env to the home of the host user that runs sbx}
            # How a sandbox reaches the supervisor (the gateway, the factory's MCP): the host's
            # loopback through the published port below.
            SANDBOX_FACTORY_URL: ${SANDBOX_FACTORY_URL:-http://host.docker.internal:${WEB_PORT:-8080}}
        ports:
            # Web UI. Bound to localhost by default: reach it over SSH tunnel /
            # Tailscale, or put Caddy / Cloudflare Tunnel in front and set
            # WEB_AUTH_PASSWORD. Set WEB_BIND=0.0.0.0 to expose it directly.
            - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
        extra_hosts:
            # Previews are published on the host's docker bridge (PREVIEW_BIND); the proxy reaches them here.
            - 'host.docker.internal:host-gateway'
        volumes:
            # The factory's data at its host path: Claude Code's config (agents/, skills/, CLAUDE.md,
            # transcripts), data/config (projects, routines, mcp.json), the database, uploads, the vault.
            - ./data:${DATA_DIR:?set DATA_DIR in .env to the absolute host path of data/}
            # SSH keys for project hosts, read-only (linked to ~/.ssh in the container and in every sandbox).
            - ./data/secrets:${DATA_DIR:?set DATA_DIR in .env to the absolute host path of data/}/secrets:ro
            # Your repositories, at the same path as on the host. Point WORKSPACES_DIR at an
            # existing folder to work on the projects you already have checked out.
            - ${WORKSPACES_DIR:?set WORKSPACES_DIR in .env to an absolute host path}:${WORKSPACES_DIR:?set WORKSPACES_DIR in .env to an absolute host path}
            # The host's Docker Sandboxes client and the three directories of its user it needs: the
            # daemon's socket and state, the settings, and the file-based secret store (spike S8).
            # Never created by Docker when missing (sbx not installed yet): the container then fails to start
            # instead of leaving a root-owned directory where the sbx package goes.
            - {
                  type: bind,
                  source: /usr/bin/sbx,
                  target: /usr/bin/sbx,
                  read_only: true,
                  bind: { create_host_path: false }
              }
            - {
                  type: bind,
                  source: '${SBX_HOME}/.local/state/sandboxes',
                  target: '${SBX_HOME}/.local/state/sandboxes',
                  bind: { create_host_path: false }
              }
            - {
                  type: bind,
                  source: '${SBX_HOME}/.config/sandboxes',
                  target: '${SBX_HOME}/.config/sandboxes',
                  bind: { create_host_path: false }
              }
            - {
                  type: bind,
                  source: '${SBX_HOME}/.config/com.docker.sandboxes',
                  target: '${SBX_HOME}/.config/com.docker.sandboxes',
                  bind: { create_host_path: false }
              }
        stdin_open: true
        tty: true
