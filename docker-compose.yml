services:
    supervisor:
        build: .
        image: pocket-factory:local
        container_name: pocket-factory
        restart: unless-stopped
        env_file: .env
        # The container is the sandbox (SPEC §8): bound memory and process
        # count so a runaway build or fork bomb cannot take the host down.
        # ≈1 GiB per claude -p session plus whatever the project's tooling needs.
        mem_limit: ${CONTAINER_MEMORY:-6g}
        pids_limit: 1024
        environment:
            # The container is the sandbox; inside it Claude Code runs unattended.
            CLAUDE_PERMISSION_MODE: bypassPermissions
        ports:
            # Web UI. Bound to localhost by default: reach it over SSH tunnel /
            # Tailscale, or put Caddy / Cloudflare Tunnel in front and set
            # WEB_AUTH_PASSWORD. Set WEB_BIND=0.0.0.0 to expose it directly.
            - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
        volumes:
            # Claude Code's own home: login, CLAUDE.md, agents/, skills/, transcripts.
            - ./data/claude:/data/claude
            # Factory config: projects/*.md, mcp.json (your own MCP servers).
            - ./data/config:/data/config
            # Your repositories. Point WORKSPACES_DIR at an existing folder on
            # your machine to work on the projects you already have checked out.
            - ${WORKSPACES_DIR:-./data/workspaces}:/data/workspaces
            - ./data/db:/data/db
            - ./data/logs:/data/logs
            # SSH keys for project hosts (linked to ~/.ssh by the entrypoint).
            - ./data/secrets:/data/secrets:ro
        # For one-off interactive runs in the container, e.g. an MCP OAuth login:
        #   docker compose run --rm -it -w /data/workspaces/<repo> supervisor claude mcp login <name> --no-browser
        stdin_open: true
        tty: true
