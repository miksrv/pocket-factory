name: Setup
description: Node from .nvmrc, Yarn through corepack, dependencies from the lockfile (cached)

inputs:
    node-version:
        description: Node.js version; empty = the one in .nvmrc
        required: false
        default: ''

runs:
    using: composite
    steps:
        # Yarn 4 comes from `packageManager` via corepack, which must be on before setup-node looks for yarn.
        - name: Enable corepack
          shell: bash
          run: corepack enable

        - name: Set up Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
              node-version: ${{ inputs.node-version }}
              node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
              cache: yarn

        - name: Install dependencies
          shell: bash
          run: yarn install --immutable
