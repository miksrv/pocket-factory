version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      groups:
          # Tooling moves together; one PR a week instead of a dozen.
          dev-tooling:
              dependency-type: development
              update-types: [minor, patch]
          runtime:
              dependency-type: production
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
          day: monday
